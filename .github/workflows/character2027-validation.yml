name: Character 2027 Validation

on:
  push:
    branches:
      - agent/character-2027-prototype-01
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Human hinge tests
        run: npx vitest run tests/unit/character2027-human-hinge.test.js

      - name: Full tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Playwright Character 2027 browser verification
        run: |
          npm run dev > /tmp/character2027-vite.log 2>&1 &
          echo $! > /tmp/character2027-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5174/e2e-social.html >/dev/null && curl -fsS http://127.0.0.1:5174/e2e-terrain.html >/dev/null; then break; fi
            sleep 1
          done
          python tests/e2e/character2027_social_playwright.py
          python tests/e2e/character2027_terrain_playwright.py

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character2027-playwright-evidence
          path: |
            artifacts/*.png
            /tmp/character2027-vite.log
          if-no-files-found: ignore

name: Character 2027 PR Validation

on:
  pull_request:
    branches:
      - agent/character-2027-ci-base

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Human hinge tests when present
        if: ${{ hashFiles('tests/unit/character2027-human-hinge.test.js') != '' }}
        run: npx vitest run tests/unit/character2027-human-hinge.test.js

      - name: Donor motion tests when present
        if: ${{ hashFiles('src/character2027/animation/QuaterniusMotionSource.test.js') != '' }}
        run: npx vitest run src/character2027/animation/QuaterniusMotionSource.test.js

      - name: Full tests
        run: npm run test:run

      - name: Production build
        run: npm run build
